<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Super Quest – The Lost Kingdom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--ac:#ffcc33}
*{box-sizing:border-box}

</style></head><body>
<div id="wrap"><canvas id="c" width="960" height="544"></canvas><div id="ui"></div></div>
<script>
'use strict';
const W=960,H=544,T=32,ROWS=17,cv=document.getElementById('c'),g=cv.getContext('2d');
const UI=document.getElementById('ui');
let save={un:0,st:{},coins:0,mus:.5,sfx:.7,diff:1,shake:1,ach:{},kills:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('sq1')||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem('sq1',JSON.stringify(save))}catch(e){}};
const WORLDS=[
{n:'Green Valley',sky:['#5ab8ff','#d6f5ff'],far:'#7cc47a',near:'#4a9d4f',top:'#4caf50',bod:'#8b5a2b',acc:'#2e7d32',wx:'leaf',ec:'#e0457b',boss:'Gorgoth the Slime Fiend'},
{n:'Desert Kingdom',sky:['#f6a95b','#ffe9b0'],far:'#e0b070',near:'#c98f4a',top:'#f0cf86',bod:'#c28e4b',acc:'#a0692c',wx:'sand',ec:'#8a5a1a',boss:'Anubrax the Sand Tyrant'},
{n:'Frozen Peaks',sky:['#8fb7e8','#eaf7ff'],far:'#b8d4f0',near:'#8fb4dc',top:'#f4fbff',bod:'#6f9fd2',acc:'#4b7fb5',wx:'snow',ice:1,ec:'#40b8e8',boss:'Glacivor the Frostbane'},
{n:'Mystic Forest',sky:['#14143c','#2f5563'],far:'#26443f',near:'#1b3633',top:'#47d18c',bod:'#4a3550',acc:'#c06bff',wx:'spore',ec:'#b46bff',boss:'Vyrmoth the Root Horror'},
{n:'Lava Fortress',sky:['#2a0a0a','#7a2210'],far:'#401010',near:'#2c0c0c',top:'#7d7d8c',bod:'#42424f',acc:'#ff6a1a',wx:'ember',ec:'#ff7a2a',boss:'Infernox the Molten'},
{n:'Sky Kingdom',sky:['#3a93ff','#c4ecff'],far:'#e9f6ff',near:'#cfeaff',top:'#ffffff',bod:'#9fc6ee',acc:'#ffd24d',wx:'wind',ec:'#7a5cff',boss:'Tempestor the Storm Tyrant'}];
const HINTS=['Stomp enemies, grab coins, and double-jump over gaps!','Desert winds push you around. Time your jumps.','Ice is slippery. Brake early!','Spores glow in the dark forest. Look for power-ups.','Spikes and lava. Stay on the stone.','Strong gusts up here. Glide helps!'];
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- AUDIO ---------- */
let AC,mg,sg;
function ac(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();sg=AC.createGain();mg.connect(AC.destination);sg.connect(AC.destination);vol()}if(AC.state=='suspended')AC.resume()}catch(e){}}
function vol(){if(AC){mg.gain.value=save.mus*.3;sg.gain.value=save.sfx*.5}}
function tone(f,d,ty,v,to,dest){if(!AC)return;try{const o=AC.createOscillator(),n=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);n.gain.setValueAtTime(v||.3,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(dest||sg);o.start();o.stop(t+d)}catch(e){}}
const arp=(a,ty,d)=>a.forEach((f,i)=>setTimeout(()=>tone(f,d,ty,.3),i*80));
const sfx={jump:()=>tone(330,.15,'square',.25,700),dj:()=>tone(500,.15,'square',.25,1000),coin:()=>arp([988,1319],'square',.12),pu:()=>arp([523,659,784,1047],'triangle',.14),hit:()=>tone(200,.3,'sawtooth',.35,60),die:()=>tone(400,.6,'sawtooth',.35,50),stomp:()=>tone(180,.12,'square',.35,80),fire:()=>tone(900,.12,'sawtooth',.2,300),win:()=>arp([523,659,784,1047,1319,1568],'square',.25),click:()=>tone(660,.06,'square',.2),slow:()=>tone(600,.5,'sine',.3,100),boom:()=>tone(120,.4,'sawtooth',.4,40)};
const SC=[[0,2,4,7,9],[0,1,4,5,7,8,11],[0,2,3,7,8],[0,2,3,5,7,9,10],[0,1,3,5,6,8],[0,2,4,7,9]],BASE=[262,220,247,196,185,294];
const MEL=WORLDS.map((_,w)=>{const r=rng(w+5);return Array.from({length:16},()=>r()<.3?-1:Math.floor(r()*8))});
let ms=0;
setInterval(()=>{return;ms++;const w=state=='menu'?mw:L.w,bs=state=='play'&&L.l==2&&!L.bossDead;if(!bs&&ms%2)return;const sc=SC[bs?3:w],n=MEL[w][ms%16];if(n>=0)tone(BASE[w]*2**(sc[n%sc.length]/12),.25,'triangle',.6,0,mg);if(ms%8==0)tone(BASE[w]/2,.5,'sine',.9,0,mg)},150);
/* ---------- LEVEL BUILD ---------- */
function build(idx){
 const w=idx/3|0,l=idx%3,R=rng(idx*7919+13),cols=120+l*25,bl=l==2,endC=cols-(bl?30:10);
 const m=[];for(let r=0;r<ROWS;r++)m.push(new Uint8Array(cols));
 const o={m,cols,w,l,en:[],coins:[],items:[],cps:[],endC,bossDead:!bl};
 const fill=(a,b,y)=>{for(let x=a;x<b;x++)for(let r=y;r<ROWS;r++)m[r][x]=1};
 const coin=(x,y)=>o.coins.push({x,y,got:0});
 let c=10,gy=13,nextCp=cols*.33;fill(0,10,gy);o.spawn={x:2*T,y:gy*T-30};
 while(c<endC){
  if(R()<.45){const gw=2+Math.floor(R()*(2+Math.min(2,w*.6)));for(let i=0;i<=gw;i++)coin((c+i)*T+16,(gy-2-Math.sin(i/gw*Math.PI)*2)*T+16);c+=gw;gy=clamp(gy+Math.floor(R()*3)-1,9,14)}
  const len=Math.min(4+Math.floor(R()*6),endC-c);if(len<=0)break;
  fill(c,c+len,gy);const mid=c+(len>>1),k=R();
  if(c>nextCp){o.cps.push({x:c*T+16,y:gy*T,on:0});nextCp+=cols*.33}
  if(len>=5&&k<.2){m[gy-1][mid]=2;if(R()<.5)m[gy-1][mid+1]=2}
  else if(len>=4&&k<.42){const t=['walk','fly','jump'][Math.floor(R()*3)],e={t,w:26,h:t=='fly'?20:26,x:mid*T,y:t=='fly'?(gy-3)*T:gy*T-26,dir:1,vy:0,hp:1,ph:R()*6,jt:60,dt:20,g:0};e.x0=e.x;e.y0=e.y;o.en.push(e)}
  else if(k<.52&&len>=3)m[gy-1][c+1]=4;
  else if(k<.64)o.items.push({x:mid*T+8,y:(gy-3)*T,t:['fire','speed','shield','magnet','glide'][Math.floor(R()*5)]});
  if(R()<.5){const py=gy-4,pl=3+Math.floor(R()*2),px=c+Math.floor(R()*(len-1));for(let x=0;x<pl;x++)if(px+x<endC)m[py][px+x]=1;for(let x=0;x<pl;x++)coin((px+x)*T+16,(py-1)*T+16)}
  for(let i=0;i<len;i++)if(R()<.3&&!m[gy-1][c+i])coin((c+i)*T+16,(gy-2)*T+16);
  c+=len}
 fill(c,cols,gy);o.flag={x:(cols-4)*T,y:gy*T};
 if(bl){const mx=[12,16,20][save.diff];o.boss={t:'boss',w:80,h:96,x:(endC+16)*T,y:gy*T-96,dir:-1,vy:0,hp:mx,max:mx,inv:0,mode:'idle',tmr:0,g:0,dt:60};o.sign={x:(endC+3)*T,y:gy*T};o.cps.push({x:(endC+2)*T+16,y:gy*T,on:0});o.en.push(o.boss)}
 o.cp={x:o.spawn.x,y:o.spawn.y};return o}
/* ---------- STATE ---------- */
let state='menu',L,P,cam=0,shake=0,gt=0,mt=0,mw=0,score=0,coinsGot=0,parts=[],shots=[],slow=0,slowCd=0,lvlIdx=0,time=0,lives=5,dmg=0,hpMax=3,toast='',toastT=0,fy={x:0,y:0},pj=0,wp=[];
const K={};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();K[e.code]=1;if(e.code=='Escape')togglePause();ac()});
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('blur',()=>{if(state=='play')togglePause()});
function inp(){const gp=(navigator.getGamepads&&navigator.getGamepads()[0])||null,ax=gp?gp.axes[0]:0,b=i=>gp&&gp.buttons[i]&&gp.buttons[i].pressed;
 return{l:K.KeyA||K.ArrowLeft||ax<-.4,r:K.KeyD||K.ArrowRight||ax>.4,j:K.Space||K.ArrowUp||K.KeyW||b(0),s:K.ShiftLeft||K.ShiftRight||b(1)||b(5),d:K.KeyS||K.ArrowDown||(gp&&gp.axes[1]>.6),e:K.KeyE||b(3),f:K.KeyF||K.KeyJ||b(2)}}
function newP(){P={x:L.cp.x,y:L.cp.y,w:22,h:30,vx:0,vy:0,face:1,g:0,jumps:0,coy:0,buf:0,hp:hpMax,inv:90,cr:0,anim:0,pw:{}}}
function start(i){ac();sfx.click();lvlIdx=i;L=build(i);hpMax=[5,3,2][save.diff];lives=5;score=0;coinsGot=0;dmg=0;time=0;slow=0;slowCd=0;shots=[];parts=[];newP();cam=0;state='play';UI.className='';pj=1;say(L.l==2?'Stomp or burn the boss. It speeds up at half health!':HINTS[L.w],360)}
const say=(t,n)=>{toast=t;toastT=n||180};
/* ---------- COLLISION ---------- */
const tile=(c,r)=>c<0||c>=L.cols?1:r<0||r>=ROWS?0:L.m[r][c];
function hitS(x,y,w,h){for(let c=Math.floor(x/T);c<=Math.floor((x+w-.01)/T);c++)for(let r=Math.floor(y/T);r<=Math.floor((y+h-.01)/T);r++)if(tile(c,r)==1)return 1;return 0}
function moveX(o,dx){o.x+=dx;const r0=Math.floor(o.y/T),r1=Math.floor((o.y+o.h-.01)/T);
 if(dx>0){const c=Math.floor((o.x+o.w)/T);for(let r=r0;r<=r1;r++)if(tile(c,r)==1){o.x=c*T-o.w-.001;return 1}}
 else if(dx<0){const c=Math.floor(o.x/T);for(let r=r0;r<=r1;r++)if(tile(c,r)==1){o.x=(c+1)*T+.001;return 1}}return 0}
function moveY(o,dy){o.y+=dy;const c0=Math.floor(o.x/T),c1=Math.floor((o.x+o.w-.01)/T);
 if(dy>0){const r=Math.floor((o.y+o.h)/T);for(let c=c0;c<=c1;c++)if(tile(c,r)==1){o.y=r*T-o.h-.001;o.vy=0;return 1}}
 else if(dy<0){const r=Math.floor(o.y/T);for(let c=c0;c<=c1;c++)if(tile(c,r)==1){o.y=(r+1)*T+.001;o.vy=0;return -1}}return 0}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function burst(x,y,c,n){if(parts.length>400)return;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.8)*6,l:30+Math.random()*20,c,s:2+Math.random()*3})}
const sh=n=>{shake=Math.max(shake,n)};
/* ---------- GAME LOGIC ---------- */
function hurt(){if(P.inv>0)return;if(P.pw.shield){delete P.pw.shield;P.inv=60;sfx.hit();burst(P.x+11,P.y+15,'#6cf',16);return}
 P.hp--;dmg++;P.inv=90;P.vy=-8;P.vx=-P.face*5;sh(8);sfx.hit();if(P.hp<=0)die()}
function die(){sfx.die();burst(P.x+11,P.y+15,'#f55',30);sh(14);lives--;
 if(lives<=0){state='over';show(`<h2>Game Over</h2><p>The kingdom needs you!</p>${btn('Retry Level','start(lvlIdx)')}${btn('Main Menu','menu()')}`);return}
 newP();say('Lives left: '+lives,90)}
function killEn(e,fire){
 if(e.t=='boss'){if(e.inv>0)return;e.hp--;e.inv=45;sh(10);sfx.boom();burst(e.x+32,e.y+30,'#ff0',25);score+=200;
  if(e.hp<=0){e.dead=1;L.bossDead=true;score+=1500;burst(e.x+32,e.y+36,'#fff',80);sh(25);sfx.win();say('BOSS DEFEATED! Reach the flag!',240);ach('boss','Boss Slayer')}return}
 e.hp--;if(e.hp<=0){e.dead=1;score+=100;save.kills++;burst(e.x+13,e.y+13,WORLDS[L.w].ec,14)}}
function upEn(e,ts){
 if(e.dead){e.dt--;return}
 const sp=[.8,1,1.25][save.diff]*ts;
 if(e.t=='fly'){e.ph+=.04*ts;e.x=e.x0+Math.sin(e.ph)*90;e.y=e.y0+Math.sin(e.ph*2)*20;e.dir=Math.cos(e.ph)>0?1:-1;return}
 e.vy+=.5*ts;
 if(e.t=='boss'){
  const ph2=e.hp<=e.max/2,d=P.x-e.x;e.tmr+=ts;if(e.inv>0)e.inv--;
  if(e.mode=='walk'){e.dir=d>0?1:-1;moveX(e,e.dir*(1.4+ph2*.8)*sp);if(e.tmr>120){e.tmr=0;e.mode=ph2&&Math.random()<.5?'jump':'charge';e.dir=d>0?1:-1;if(e.mode=='jump')e.vy=-14;else if(ph2)shots.push({x:e.x+32,y:e.y+30,vx:e.dir*4,vy:0,h:1,l:200})}}
  else if(e.mode=='charge'){if(moveX(e,e.dir*(5+ph2*1.5)*sp)){sh(8);sfx.boom();e.mode='walk';e.tmr=-40}if(e.tmr>55){e.mode='walk';e.tmr=0}}
  else{moveX(e,e.dir*3*sp);if(e.g&&e.tmr>20){e.mode='walk';e.tmr=0;sh(12);sfx.boom();shots.push({x:e.x+32,y:e.y+50,vx:-4,vy:0,h:1,l:160},{x:e.x+32,y:e.y+50,vx:4,vy:0,h:1,l:160})}}
  const a=(L.endC+1)*T,b=(L.cols-5)*T-e.w;if(e.x<a){e.x=a;e.dir=1}if(e.x>b){e.x=b;e.dir=-1}
  e.g=moveY(e,e.vy*ts)>0;return}
 const hit=moveX(e,e.dir*(e.t=='walk'?1.1:.9)*sp);
 if(hit||(e.g&&!tile(Math.floor((e.dir>0?e.x+e.w+2:e.x-2)/T),Math.floor((e.y+e.h+4)/T))))e.dir*=-1;
 e.g=moveY(e,e.vy*ts)>0;
 if(e.t=='jump'&&e.g&&(e.jt-=ts)<=0){e.vy=-9;e.jt=70+Math.random()*40}
 if(e.y>ROWS*T+50)e.dead=1}
function update(){
 const i=inp(),jp=i.j&&!pj;pj=i.j;time+=1/60;if(jp)P.buf=8;
 const wd=WORLDS[L.w],ice=wd.ice,mx=(i.r?1:0)-(i.l?1:0),ts=slow>0?.35:1;
 if(i.d&&P.g&&!P.cr){P.cr=1;P.h=18;P.y+=12}else if(!i.d&&P.cr&&!hitS(P.x,P.y-12,P.w,30)){P.cr=0;P.y-=12;P.h=30}
 const sl=P.cr&&Math.abs(P.vx)>3,lim=sl?7:(P.pw.speed?1.4:1)*(i.s?6:4)*(P.cr?.4:1);
 if(mx&&!sl){P.vx+=mx*(ice?.22:.9);P.face=mx;P.anim++}else P.vx*=P.g?(ice?.985:(P.cr?.96:.8)):.97;
 P.vx=clamp(P.vx,-lim,lim);if(L.w==1||L.w==5)P.vx+=Math.sin(time*.7)*.05;
 if(P.g){P.coy=6;P.jumps=0}else P.coy--;
 if(P.buf>0){if(P.coy>0){P.vy=-13.4-(Math.abs(P.vx)>5?.8:0);P.coy=0;P.buf=0;P.jumps=1;sfx.jump()}
  else if(P.jumps<2){P.vy=-12;P.jumps=2;P.buf=0;burst(P.x+11,P.y+30,'#fff',8);sfx.dj()}}
 P.buf--;if(!i.j&&P.vy<-5)P.vy*=.85;
 P.vy=Math.min(P.vy+.62,14);if(P.pw.glide&&i.j&&P.vy>1.5)P.vy=1.5;
 P.g=0;if(moveX(P,P.vx))P.vx=0;if(moveY(P,P.vy)>0)P.g=1;
 const fc=Math.floor((P.x+11)/T),fr=Math.floor((P.y+P.h-4)/T);
 if(tile(fc,fr)==4&&P.vy>=0){P.vy=-19;P.jumps=1;P.g=0;sfx.jump();burst(P.x+11,P.y+30,'#ff0',10)}
 for(let c=Math.floor(P.x/T);c<=Math.floor((P.x+P.w)/T);c++)for(let r=Math.floor(P.y/T);r<=Math.floor((P.y+P.h)/T);r++)if(tile(c,r)==2&&P.y+P.h>r*T+14)hurt();
 if(P.y>ROWS*T+40){die();return}
 if(P.inv>0)P.inv--;
 for(const k in P.pw)if(k!='shield'&&--P.pw[k]<=0)delete P.pw[k];
 if(i.f&&P.pw.fire&&!P.fcd){shots.push({x:P.x+11,y:P.y+14,vx:P.face*7,vy:0,l:90});P.fcd=18;sfx.fire()}if(P.fcd)P.fcd--;
 if(i.e&&slowCd<=0){slow=240;slowCd=720;sfx.slow();say('TIME SLOW!',60)}
 if(slow>0)slow--;if(slowCd>0)slowCd--;
 for(const c of L.cps)if(!c.on&&Math.abs(P.x-c.x)<30&&Math.abs(P.y+30-c.y)<50){c.on=1;L.cp={x:c.x-11,y:c.y-32};say('Checkpoint!',90);sfx.pu()}
 for(const c of L.coins){if(c.got)continue;const dx=P.x+11-c.x,dy=P.y+15-c.y,d=Math.hypot(dx,dy);
  if(P.pw.magnet&&d<150){c.x+=dx/d*6;c.y+=dy/d*6}
  if(d<22){c.got=1;coinsGot++;score+=10;save.coins++;sfx.coin();if(save.coins==100)ach('coin','Coin Collector')}}
 for(const it of L.items)if(!it.got&&ov(P,{x:it.x,y:it.y,w:26,h:26})){it.got=1;P.pw[it.t]=it.t=='shield'?1:900;score+=50;sfx.pu();burst(it.x+13,it.y+13,'#ff0',16);say('Power-up: '+it.t.toUpperCase(),90)}
 for(const s of shots){s.x+=s.vx*(s.h?ts:1);s.y+=s.vy;s.l--;
  if(s.h){if(s.dl>0){s.dl--;s.y=-40;s.vy=0;continue}if(s.rock){s.vy+=.4;if(tile(Math.floor(s.x/T),Math.floor((s.y+14)/T))==1){s.l=0;sh(6);burst(s.x,s.y,'#aaa',10)}}if(s.wave?(Math.abs(P.x+11-s.x)<20&&P.y+P.h>s.y-26&&P.y<s.y):Math.hypot(P.x+11-s.x,P.y+15-s.y)<(s.rock?22:16)){hurt();if(!s.wave)s.l=0}continue}
  s.vy+=.3;if(tile(Math.floor(s.x/T),Math.floor((s.y+4)/T))==1){if(s.vy>0){s.vy=-4}else s.l=0}
  if(tile(Math.floor((s.x+s.vx)/T),Math.floor(s.y/T))==1)s.l=0;
  for(const e of L.en)if(!e.dead&&Math.abs(e.x+e.w/2-s.x)<e.w/2+5&&Math.abs(e.y+e.h/2-s.y)<e.h/2+5){killEn(e,1);s.l=0;burst(s.x,s.y,'#f80',8)}}
